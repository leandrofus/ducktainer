name: Release

# Runs on a tag like v0.2.0: tag.yml creates it (and starts this workflow)
# when a version bump reaches main; pushing one by hand works too. Builds the
# rpm/deb packages (amd64, arm64, with PAM), the static binaries and the
# Windows MSI, and attaches them to the GitHub release, plus version-less
# "latest" copies of the packages for stable links.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # tag.yml, on the new tag

permissions:
  contents: write
  actions: write # to rebuild the site with the new release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # a manual run on a branch must not publish anything
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Web UI
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Tests
        run: go test ./...
      - name: rpm + deb
        run: make packages PKG_VERSION="${GITHUB_REF_NAME#v}"
      - name: Static binaries
        run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Latest aliases
        # Version-less copies of the packages, so that
        # releases/latest/download/<name> always serves the newest release
        # (the binaries already have version-less names).
        run: |
          cp dist/packages/* dist/
          cd dist
          for f in ducktainer-*.rpm; do
            arch=${f%.rpm}; arch=${arch##*.}           # ducktainer-1.2.0-1.x86_64.rpm -> x86_64
            cp "$f" "ducktainer-latest.$arch.rpm"
          done
          for f in ducktainer_*.deb; do
            arch=${f##*_}; arch=${arch%.deb}            # ducktainer_1.2.0-1_amd64.deb -> amd64
            cp "$f" "ducktainer_latest_$arch.deb"
          done
          ls -l ducktainer-latest.* ducktainer_latest_*
      - name: Checksums
        run: |
          cd dist && sha256sum ducktainer-*.rpm ducktainer_*.deb ducktainer-linux-* ducktainer-darwin-* ducktainer-windows-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/*.rpm dist/*.deb dist/ducktainer-linux-* dist/ducktainer-darwin-* dist/ducktainer-windows-* dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "ducktainer ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi

  msi:
    # Windows installer (service + sign-in with Windows accounts), built with
    # WiX on Windows and added to the release made above
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Web UI
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: MSI
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" -o dist/ducktainer.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # static Linux agents for the nodes this server enrolls
          foreach ($a in 'amd64', 'arm64') {
            $env:CGO_ENABLED = '0'; $env:GOOS = 'linux'; $env:GOARCH = $a
            go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" -o "dist/agent/ducktainer-agent-linux-$a" .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Remove-Item Env:CGO_ENABLED, Env:GOOS, Env:GOARCH
          ./packaging/windows/build-msi.ps1 -Version $v -Exe dist/ducktainer.exe -Out "dist/ducktainer-$v-x64.msi" -AgentDir dist/agent
          Copy-Item "dist/ducktainer-$v-x64.msi" dist/ducktainer-latest-x64.msi
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          gh release download $env:GITHUB_REF_NAME -p SHA256SUMS -D sums
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = Get-Content sums/SHA256SUMS | Where-Object { $_ -notmatch '\.msi$' }
          foreach ($f in "ducktainer-$v-x64.msi", 'ducktainer-latest-x64.msi') {
            $lines += "$((Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", ($lines -join "`n") + "`n")
          gh release upload $env:GITHUB_REF_NAME "dist/ducktainer-$v-x64.msi" dist/ducktainer-latest-x64.msi dist/SHA256SUMS --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  site:
    needs: [release, msi]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # releases made with GITHUB_TOKEN do not trigger other workflows
        run: gh workflow run pages.yml --ref main

name: Windows

# Docker on Windows without Docker Desktop (`ducktainer engine install`),
# installed for real on GitHub's Windows runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...

  msi:
    # The installer for real: service, sign-in with Windows accounts,
    # upgrade and uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build two versions
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=v0.0.1" -o dist/1/ducktainer.exe .
          go build -trimpath -ldflags "-s -w -X main.version=v0.0.2" -o dist/2/ducktainer.exe .
          foreach ($a in 'amd64', 'arm64') {
            $env:CGO_ENABLED = '0'; $env:GOOS = 'linux'; $env:GOARCH = $a
            go build -trimpath -o "dist/agent/ducktainer-agent-linux-$a" .
          }
          Remove-Item Env:CGO_ENABLED, Env:GOOS, Env:GOARCH
      - name: MSI
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1 -Version 0.0.1 -Exe dist/1/ducktainer.exe -Out dist/ducktainer-0.0.1-x64.msi -AgentDir dist/agent
          ./packaging/windows/build-msi.ps1 -Version 0.0.2 -Exe dist/2/ducktainer.exe -Out dist/ducktainer-0.0.2-x64.msi -AgentDir dist/agent
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/ducktainer-0.0.1-x64.msi
      - name: Install, sign in, upgrade, uninstall
        shell: pwsh
        run: ./packaging/windows/test-msi.ps1 -Msi dist/ducktainer-0.0.1-x64.msi -Upgrade dist/ducktainer-0.0.2-x64.msi -UpgradeVersion v0.0.2 -Uninstall
      - name: Logs
        if: failure()
        shell: pwsh
        run: Get-Content "$env:ProgramData\ducktainer\ducktainer.log" -ErrorAction SilentlyContinue

  native:
    # Windows containers: dockerd.exe as a service, reached through npipe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o ducktainer.exe .
      - name: Remove the runner's preinstalled Docker
        shell: pwsh
        run: |
          Stop-Service docker -ErrorAction SilentlyContinue
          sc.exe delete docker
          Get-Command docker -All -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "was: $($_.Source)" }
      - name: ducktainer engine install --mode native
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\ducktainer.exe engine install --mode native
      - name: ducktainer engine status
        run: .\ducktainer.exe engine status
      - name: Run a Windows container through the new engine
        shell: pwsh
        run: |
          $docker = "$env:ProgramFiles\Docker\docker.exe"
          & $docker version
          & $docker compose version
          & $docker run --rm mcr.microsoft.com/windows/nanoserver:ltsc2022 cmd /c echo hello from a native engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $docker run -d --name squeak-native mcr.microsoft.com/windows/nanoserver:ltsc2022 ping -t localhost
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: ducktainer talks to it (npipe endpoint)
        shell: pwsh
        run: |
          $out = .\ducktainer.exe ps | Out-String
          $out
          if ($out -notmatch 'squeak-native') { throw 'ducktainer does not see the container' }

  wsl:
    # Linux containers: Docker in a WSL 2 distribution of ducktainer's own
    runs-on: windows-latest
    needs: msi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o ducktainer.exe .
      - name: WSL on this runner
        shell: pwsh
        run: |
          wsl.exe --version
          wsl.exe --status
          exit 0
      - name: ducktainer engine install --mode wsl
        run: .\ducktainer.exe engine install --mode wsl
      - name: ducktainer engine status
        run: .\ducktainer.exe engine status
      - name: Run a Linux container through the new engine
        run: |
          wsl.exe -d ducktainer -u root -- docker run --rm hello-world
          wsl.exe -d ducktainer -u root -- docker run -d --name squeak-wsl alpine sleep 600
      - name: ducktainer talks to it (wsl endpoint)
        shell: pwsh
        run: |
          $out = .\ducktainer.exe ps -e wsl | Out-String
          $out
          if ($out -notmatch 'squeak-wsl') { throw 'ducktainer does not see the container' }
      - name: The distribution keeps running without a terminal attached
        shell: pwsh
        run: |
          # WSL stops idle distributions after a few seconds; the keepalive
          # started by the installer must prevent it
          Start-Sleep -Seconds 45
          $running = wsl.exe -d ducktainer -u root -- docker inspect -f '{{.State.Running}}' squeak-wsl
          "running: $running"
          if ($running -ne 'true') { throw 'the container stopped with the distribution' }
      - uses: actions/download-artifact@v4
        with:
          name: msi
      - name: The service (LocalSystem) reaches WSL through the relay
        shell: pwsh
        run: ./packaging/windows/test-msi.ps1 -Msi ducktainer-0.0.1-x64.msi -Wsl squeak-wsl
      - name: Logs
        if: failure()
        shell: pwsh
        run: Get-Content "$env:ProgramData\ducktainer\ducktainer.log" -ErrorAction SilentlyContinue

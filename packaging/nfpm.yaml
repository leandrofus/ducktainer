# nfpm config — built by packaging/build.sh (make packages)
name: ducktainer
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: ${MAINTAINER}
description: |
  Agentless Docker management: CRM-style web UI, compose stacks,
  marketplace, terminal and live logs. Sign-in with system users (PAM)
  and roles by POSIX groups.
vendor: ducktainer
license: AGPL-3.0-or-later

depends:
  - libpam0g
# the project was called dockera until 0.1.0; both listen on port 9900
conflicts:
  - dockera
overrides:
  rpm:
    depends:
      - pam
      # any Docker-compatible engine; how ducktainer reaches it is detected at install (ducktainer setup)
      - (docker-ce or moby-engine or docker or docker-ee or podman-docker)
    recommends:
      - (docker-compose-plugin or docker-compose)
      - openssh-clients
  deb:
    depends:
      - libpam0g
      - docker-ce | docker.io | moby-engine | docker-engine | docker-ee
    recommends:
      - docker-compose-plugin | docker-compose-v2
      - openssh-client

contents:
  - src: ./dist/build/ducktainer-linux-${ARCH}
    dst: /usr/bin/ducktainer
    file_info: { mode: 0755 }
  # static agent binaries for nodes (any architecture, no glibc requirement)
  - src: ./dist/build/ducktainer-agent-linux-amd64
    dst: /usr/lib/ducktainer/agent/ducktainer-agent-linux-amd64
    file_info: { mode: 0755 }
  - src: ./dist/build/ducktainer-agent-linux-arm64
    dst: /usr/lib/ducktainer/agent/ducktainer-agent-linux-arm64
    file_info: { mode: 0755 }
  - src: ./LICENSE
    dst: /usr/share/licenses/ducktainer/LICENSE
    packager: rpm
  - src: ./LICENSE
    dst: /usr/share/doc/ducktainer/copyright
    packager: deb
  - src: ./packaging/systemd/ducktainer.service
    dst: /usr/lib/systemd/system/ducktainer.service
  - src: ./packaging/systemd/ducktainer-pam.socket
    dst: /usr/lib/systemd/system/ducktainer-pam.socket
  - src: ./packaging/systemd/ducktainer-pam@.service
    dst: /usr/lib/systemd/system/ducktainer-pam@.service
  - src: ./packaging/ducktainer.env
    dst: /etc/ducktainer/ducktainer.env
    type: config|noreplace
  - src: ./packaging/pam/ducktainer.redhat
    dst: /etc/pam.d/ducktainer
    type: config|noreplace
    packager: rpm
  - src: ./packaging/pam/ducktainer.debian
    dst: /etc/pam.d/ducktainer
    type: config|noreplace
    packager: deb

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
